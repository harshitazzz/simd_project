name: simulation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Unit tests (run whatever has been pushed so far)
        run: make unit
      - name: System tests + benchmark (only when the full design is present)
        run: |
          if [ -f rtl/simd_core.v ] && [ -f rtl/bench_top.v ] && [ -f tb/tb_simd_core.v ] && [ -f tb/tb_bench.v ]; then
            make system && make bench
          else
            echo "Full design not on this branch yet - skipping system tests"
          fi
